<style>
:root{--bg:#09090b;--sf:#121214;--tx:#f4f4f5;--mu:#a1a1aa;--ac:#e5b84b;--ln:rgba(255,255,255,.1);--wa:#25d366}
html[data-theme="light"]{--bg:#ffffff;--sf:#f4f6f8;--tx:#15171a;--mu:#626a73;--ac:#2368b4;--ln:rgba(20,30,40,.14);--wa:#25d366;color-scheme:light}
html[data-theme="light"] header.s{background:rgba(255,255,255,.82)}
html[data-theme="light"] .logo{background:rgba(0,0,0,.03);border-color:var(--ln)}
html[data-theme="light"] nav{background:rgba(0,0,0,.025)}
html[data-theme="light"] nav a.on{background:rgba(35,104,180,.12);color:var(--ac)}
html[data-theme="light"] .btn{background:linear-gradient(135deg,#4d91d6,#2368b4 55%,#174d89);color:#fff;box-shadow:0 8px 28px rgba(35,104,180,.18)}
html[data-theme="light"] .btn.out{background:transparent;color:var(--tx);border-color:rgba(20,30,40,.25);box-shadow:none}
html[data-theme="light"] .badge{border-color:rgba(35,104,180,.28);background:rgba(35,104,180,.06)}
html[data-theme="light"] h1 mark,html[data-theme="light"] h2 mark{background:linear-gradient(135deg,#5b9bd9,#2368b4 52%,#174d89);-webkit-background-clip:text;background-clip:text}
html[data-theme="light"] .card{background:linear-gradient(160deg,rgba(0,0,0,.025),rgba(0,0,0,.005))}
html[data-theme="light"] .cta-card{background:radial-gradient(circle at 50% 0,rgba(35,104,180,.10),transparent 62%),var(--sf)}
html[data-theme="light"] #gear .card{background:rgba(255,255,255,.78)}
html[data-theme="light"] .gearbg::after{background:linear-gradient(90deg,rgba(255,255,255,.94),rgba(255,255,255,.48))}
html[dir="rtl"][data-theme="light"] .gearbg::after{background:linear-gradient(270deg,rgba(255,255,255,.94),rgba(255,255,255,.48))}
html[data-theme="light"] .bokeh{opacity:.25}
.theme-toggle{padding:8px 11px;border:1px solid var(--ln);border-radius:10px;background:transparent;font-size:13px;min-width:42px}

*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{background:var(--bg);color:var(--tx);font-family:Manrope,system-ui,sans-serif;line-height:1.65;overflow-x:hidden}
html[lang=ar] body{font-family:Cairo,Manrope,system-ui,sans-serif}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
.wrap{max-width:1160px;margin:0 auto;padding:0 22px}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;font-weight:600;line-height:1.2}
html[lang=ar] h1,html[lang=ar] h2,html[lang=ar] h3{font-family:Cairo,Georgia,serif;font-weight:700}
header{position:sticky;top:0;z-index:30;padding:12px 0;transition:background .3s}
header.s{background:rgba(9,9,11,.8);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--ln)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:block;padding:6px 14px;border:1px solid rgba(255,255,255,.22);border-radius:14px;background:rgba(255,255,255,.08);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.logo img{height:36px;width:auto;display:block}
/* Keep the brand mark legible in both themes: white at night, black in daylight. */
html[data-theme="light"] .logo img,html[data-theme="light"] #cbLogo{filter:brightness(0)}
/* Light-theme refinements: blue experience/contact elements and white booking fields. */
html[data-theme="light"] .stat b{background:linear-gradient(135deg,#5b9bd9,#2368b4 52%,#174d89);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
html[data-theme="light"] .cc{border-color:rgba(35,104,180,.24);background:rgba(35,104,180,.055)}
html[data-theme="light"] a.cc:hover{border-color:rgba(35,104,180,.55);background:rgba(35,104,180,.10)}
html[data-theme="light"] .cc.pri{border-color:rgba(35,104,180,.38);background:rgba(35,104,180,.10)}
html[data-theme="light"] .ci{background:linear-gradient(135deg,#5b9bd9,#2368b4 55%,#174d89);color:#fff}
html[data-theme="light"] a.cc::after,html[data-theme="light"] .tl small{color:#2368b4}
html[data-theme="light"] .form input,html[data-theme="light"] .form select,html[data-theme="light"] .form textarea{background:#fff;color:#15171a;border-color:rgba(20,30,40,.18)}
html[data-theme="light"] .form input::placeholder,html[data-theme="light"] .form textarea::placeholder{color:#7b8490}
nav{display:flex;gap:4px;padding:5px;border:1px solid var(--ln);border-radius:99px;background:rgba(255,255,255,.04)}
nav a{padding:6px 15px;border-radius:99px;font-size:14px;color:var(--mu);transition:.2s}
nav a:hover{color:var(--tx)}nav a.on{background:rgba(255,255,255,.1);color:var(--ac)}
.right{display:flex;gap:8px;align-items:center}
.lang{padding:8px 12px;border:1px solid var(--ln);border-radius:10px;background:transparent;font-size:13px}
.btn{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;padding:12px 26px;border-radius:99px;background:linear-gradient(135deg,#f9df8a,#e5b84b 55%,#c49123);color:#111;font-weight:700;font-size:14px;border:0;transition:transform .25s,box-shadow .25s;box-shadow:0 8px 28px rgba(229,184,75,.22)}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 34px rgba(229,184,75,.34)}
.btn.sm{padding:9px 18px;box-shadow:none}
.btn.out{background:transparent;color:var(--tx);border:1.5px solid rgba(255,255,255,.28);box-shadow:none}
.btn.out:hover{border-color:var(--ac);color:var(--ac)}
.arr::after{content:"\2192"}html[dir=rtl] .arr::after{content:"\2190"}
.hero{position:relative;overflow:hidden;padding:72px 0 96px;border-bottom:1px solid var(--ln)}
.bgv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center center;opacity:.42;filter:saturate(.9) contrast(1.06);transform:scale(1.015)}
.hero .wrap{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:48px}
.badge{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border:1px solid rgba(229,184,75,.35);border-radius:99px;font-size:13px;color:var(--ac);background:rgba(229,184,75,.07);margin-bottom:22px}
.badge i{width:7px;height:7px;border-radius:50%;background:var(--ac);animation:pulse 1.8s infinite}
@keyframes pulse{50%{opacity:.25}}
.eyebrow{color:var(--mu);font-size:14px;letter-spacing:.06em;margin-bottom:10px}
h1{font-size:clamp(32px,4.6vw,58px);margin-bottom:18px}
h1 mark,h2 mark{background:linear-gradient(135deg,#f9df8a,#e5b84b 52%,#c49123);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.lead{color:var(--mu);font-size:17px;max-width:520px;margin-bottom:30px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.me{width:min(300px,30vw);aspect-ratio:4/5;border-radius:16px;overflow:hidden;border:1px solid var(--ln);flex-shrink:0;box-shadow:0 30px 70px rgba(0,0,0,.5)}
.me img{width:100%;height:100%;object-fit:cover;display:block}
.clients{display:flex;flex-wrap:wrap;align-items:center;gap:10px 28px;padding-top:22px;padding-bottom:22px;color:var(--mu);font-size:14px}
.clients b{color:var(--tx);font-weight:700;letter-spacing:.05em}
section{padding:84px 0}
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:30px}
.kick{color:var(--ac);font-size:13px;font-weight:700;letter-spacing:.12em;margin-bottom:8px;text-transform:uppercase}
h2{font-size:clamp(26px,3.2vw,38px)}
.arrows{display:flex;gap:8px}
.arrows button{width:40px;height:40px;border-radius:50%;border:1px solid var(--ln);background:transparent;font-size:20px;transition:.2s}
.arrows button:hover{border-color:var(--ac);color:var(--ac)}
.car{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:12px;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.car figure{flex:0 0 clamp(180px,22vw,250px);aspect-ratio:3/4;border-radius:16px;overflow:hidden;scroll-snap-align:start;background:var(--sf);cursor:zoom-in}
.car img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.car figure:hover img{transform:scale(1.06)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chips button{padding:8px 18px;border-radius:99px;border:1px solid var(--ln);background:transparent;font-size:14px;font-weight:500;transition:.2s}
.chips button:hover{border-color:rgba(229,184,75,.5)}
.chips button.on{background:var(--ac);color:#111;border-color:var(--ac);font-weight:700}
.chips.sub{margin-bottom:22px}.chips.sub button{font-size:13px;padding:6px 14px}
.grid{columns:3 260px;column-gap:14px}
.grid figure{break-inside:avoid;margin:0 0 14px;border-radius:14px;overflow:hidden;background:var(--sf);cursor:zoom-in}
.grid img{width:100%;display:block;transition:transform .4s}.grid figure:hover img{transform:scale(1.04)}
.grid figure{position:relative}
.grid figcaption{position:absolute;inset-inline:0;bottom:0;padding:30px 12px 10px;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff;font-size:12px;letter-spacing:.06em;opacity:0;transition:opacity .25s;pointer-events:none}
.grid figure:hover figcaption,.grid figure:focus-visible figcaption{opacity:1}
@media(hover:none){.grid figcaption{opacity:1}}
.chips button i{font-style:normal;font-size:11px;opacity:.65;margin-inline-start:7px}
.chips button.on i{opacity:.8}
.reels{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.reels video{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:14px;background:#000;display:block}
.sech{font-size:20px;margin:34px 0 16px}
.svc{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
#svc{grid-template-columns:repeat(3,1fr)}
.card{padding:26px;border:1px solid var(--ln);border-radius:18px;background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.015))}
.card em{font-style:normal;color:var(--ac);font-size:13px;font-weight:700;letter-spacing:.1em}
.card h3{font-size:19px;margin:10px 0 6px}.card p,.card small{color:var(--mu);font-size:14px}
.also{margin:26px 0 12px;color:var(--mu);font-size:14px}
.pills{display:flex;flex-wrap:wrap;gap:8px}.pills span{padding:7px 14px;border:1px solid var(--ln);border-radius:99px;font-size:13px;color:var(--mu)}
.about{display:grid;grid-template-columns:1.4fr 1fr;gap:40px;align-items:start;margin-bottom:20px}
.abp{color:var(--mu);font-size:16px;margin-top:14px}
.stat{padding:28px;border:1px solid var(--ln);border-radius:20px;background:var(--sf)}
.stat b{display:block;font-size:60px;line-height:1;background:linear-gradient(135deg,#f9df8a,#e5b84b 52%,#c49123);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-family:'Playfair Display',serif}
.stat>span{color:var(--mu)}
.tl{border-inline-start:2px solid var(--ac);padding-inline-start:24px;display:grid;gap:26px}
.tl small{color:var(--ac);font-weight:700}.tl p{color:var(--mu)}
.cta-card{text-align:center;padding:64px 22px;border:1px solid var(--ln);border-radius:26px;background:radial-gradient(circle at 50% 0,rgba(229,184,75,.13),transparent 62%),var(--sf)}
.cta-card p{color:var(--mu);max-width:480px;margin:12px auto 26px}
footer{border-top:1px solid var(--ln);padding:48px 0 24px}
.fgrid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:34px}
.fgrid p{color:var(--mu);font-size:14px;margin:8px 0 16px;max-width:320px}
.fh{color:var(--mu);font-size:12px;letter-spacing:.1em;margin-bottom:12px;text-transform:uppercase}
.fgrid a:not(.btn){display:block;font-size:14px;margin-bottom:8px}.fgrid a:not(.btn):hover{color:var(--ac)}
.copy{color:var(--mu);font-size:13px;margin-top:34px}
.wa{position:fixed;bottom:18px;inset-inline-end:18px;z-index:40;display:flex;align-items:center;gap:8px;padding:11px 18px;border-radius:99px;background:var(--wa);color:#06280f;font-weight:700;font-size:14px;box-shadow:0 8px 26px rgba(0,0,0,.45)}
.wa svg{width:20px;height:20px;fill:#06280f}
.lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.93);display:none;place-items:center;padding:20px;cursor:zoom-out}
.lb.on{display:grid}
.lbx{max-width:min(920px,100%);display:flex;flex-direction:column;gap:14px;align-items:center;cursor:default}
.lbx img{max-width:100%;max-height:76vh;border-radius:12px;display:block}
.lbc{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;flex-wrap:wrap}
.lbc span{color:var(--mu);font-size:14px}
.lbclose{position:absolute;top:16px;inset-inline-end:16px;width:42px;height:42px;border-radius:50%;border:1px solid var(--ln);background:rgba(255,255,255,.08);font-size:18px}
.bokeh{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;-webkit-mask-image:linear-gradient(transparent,#000 22%,#000 78%,transparent);mask-image:linear-gradient(transparent,#000 22%,#000 78%,transparent)}
#gear{position:relative;overflow:hidden;border-block:1px solid var(--ln)}
#gear .wrap{position:relative;z-index:1}
.gearbg{position:absolute;inset:0;pointer-events:none}
.gbv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.4}
.gearbg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(9,9,11,.94),rgba(9,9,11,.45))}
html[dir=rtl] .gearbg::after{background:linear-gradient(270deg,rgba(9,9,11,.94),rgba(9,9,11,.45))}
.gsub{color:var(--mu);max-width:560px;margin-top:10px}
#gear .card{background:rgba(18,18,22,.8);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.lens{flex:0 1 520px;width:100%;max-width:520px;height:auto;opacity:.95;-webkit-mask-image:linear-gradient(90deg,transparent,#000 16%);mask-image:linear-gradient(90deg,transparent,#000 16%)}
#gear .hd{align-items:center;flex-wrap:wrap;gap:24px}
.gtxt{flex:1 1 320px}
.lensm{animation:mount 8s ease-in-out infinite}
@keyframes mount{0%,6%{transform:translateX(-240px)}34%,76%{transform:translateX(0)}96%,100%{transform:translateX(-240px)}}
.twist{animation:twist 8s ease-in-out infinite}
@keyframes twist{0%,34%{transform:translateY(0)}42%,72%{transform:translateY(-12px)}78%,100%{transform:translateY(0)}}
.click{transform-origin:466px 195px;opacity:0;animation:click 8s ease-out infinite}
@keyframes click{0%,42%{opacity:0;transform:scale(.6)}44%{opacity:1}56%,100%{opacity:0;transform:scale(1.7)}}
.gearbg::before{content:"";position:absolute;inset:0;background:url(assets/video/gear.jpg) center/cover no-repeat;opacity:.4}
#gear.real .lens{display:none}
.cgrid{display:grid;grid-template-columns:1fr 1.2fr;gap:34px;align-items:start}
.cinfo>p:not(.kick){color:var(--mu);margin:12px 0 22px;max-width:420px}
.cinfo{padding:34px;border:1px solid var(--ln);border-radius:24px;background:radial-gradient(circle at 0 0,rgba(229,184,75,.12),transparent 55%),var(--sf)}
.cbrand{display:flex;align-items:center;gap:14px;margin-bottom:26px;padding-bottom:22px;border-bottom:1px solid var(--ln)}
.cbrand img{height:40px;width:auto;display:block}
.cbrand span{color:var(--mu);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.cc{display:flex;align-items:center;gap:14px;padding:13px 16px;border:1px solid var(--ln);border-radius:16px;background:rgba(255,255,255,.03);margin-bottom:10px;transition:transform .25s,border-color .25s,background .25s}
a.cc:hover{transform:translateY(-2px);border-color:rgba(229,184,75,.55);background:rgba(229,184,75,.06)}
.cc.pri{border-color:rgba(229,184,75,.4);background:rgba(229,184,75,.08)}
a.cc::after{content:"\2197";margin-inline-start:auto;color:var(--ac);font-size:18px}
.ci{flex:0 0 42px;height:42px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#f9df8a,#e5b84b 55%,#c49123);color:#111}
.ci svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ci svg.f{fill:currentColor;stroke:none}
.cc small{display:block;color:var(--mu);font-size:12px;letter-spacing:.06em}
.cc b{display:block;font-size:16px;font-weight:600;unicode-bidi:plaintext}
.form{display:grid;gap:14px;padding:28px;border:1px solid var(--ln);border-radius:22px;background:var(--sf)}
.form label{display:grid;gap:6px;font-size:13px;color:var(--mu)}
.form input,.form select,.form textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--ln);background:#0d0d10;color:var(--tx);font:inherit;font-size:15px}
.form input:focus,.form select:focus,.form textarea:focus{border-color:var(--ac);outline:none}
.form input[type="date"]{cursor:pointer;min-height:49px;color-scheme:dark}\nhtml[data-theme="light"] .form input[type="date"]{color-scheme:light}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form .btn{justify-self:start;cursor:pointer}
.fstatus{font-size:13px;color:var(--ac);min-height:18px}
.rv{opacity:0;transform:translateY(24px);transition:opacity .7s,transform .7s,border-color .3s}
.rv.in{opacity:1;transform:none}
.card.rv.in:hover{transform:translateY(-4px);border-color:rgba(229,184,75,.45)}
@media(max-width:900px){html{scroll-padding-top:130px}.bar{flex-wrap:wrap}nav{order:3;width:100%;overflow-x:auto;justify-content:flex-start;scrollbar-width:none}.about,.fgrid,.cgrid{grid-template-columns:1fr}#svc{grid-template-columns:repeat(2,1fr)}}

.film-strip{position:relative;width:100%;height:clamp(220px,34vw,440px);overflow:hidden;border-top:1px solid var(--ln);border-bottom:1px solid var(--ln);background:#09090b;margin:12px 0 42px}
.film-strip video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;opacity:.24;filter:saturate(.82) contrast(1.05)}
.film-strip .film-copy{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;color:#f7f5f0;text-shadow:0 2px 16px rgba(0,0,0,.65)}
.film-copy .film-kicker{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--ac);margin:0 0 12px}
.film-copy h2{font-size:clamp(26px,4.2vw,56px);letter-spacing:.06em;margin:0 0 12px}
.film-copy p{max-width:700px;margin:0;font-size:clamp(13px,1.4vw,17px);line-height:1.8;color:rgba(255,255,255,.82)}
.film-strip::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(9,9,11,.16),rgba(9,9,11,.38))}
@media(max-width:700px){.film-strip{height:230px;margin:4px 0 28px}.film-strip video{object-position:center}}
@media(max-width:700px){.hero .wrap{flex-direction:column;align-items:flex-start}.me{width:min(230px,62vw)}.hero{padding:48px 0 64px}}
@media(max-width:560px){.cinfo{padding:24px}.form{padding:22px}#svc{grid-template-columns:1fr}.form .two{grid-template-columns:1fr}.wa span{display:none}.wa{padding:13px}.btn.sm{padding:8px 14px;font-size:13px}}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}.gbv{display:none}.lens *{animation:none!important}html{scroll-behavior:auto}}

.hero{position:relative;isolation:isolate;overflow:hidden}
.hero-bg-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;opacity:.22;filter:saturate(.82) contrast(1.05);z-index:0;pointer-events:none}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(9,9,11,.68),rgba(9,9,11,.28));z-index:0}
.hero .bokeh{z-index:1}
.hero .wrap{z-index:2}
</style>

function items(){
  const out = [];

    CATS.forEach(k => {
      // "All" is a top-level filter: show two images per category.
      // For Products, choose two images total across its subcategories.
      if (k.subs){

      } else {

    return out;
  }

    if (main === k.id && (!k.subs || sub === "all" || sub === x.id) && !(k.subs && sub === "all")) out.push(...pics(x));

    v.onerror = () => { v.remove(); reelVis(); };
    $("#reels").append(v);

(function(){
  const cv = $("#bokeh");
  if (!cv) return;
  if (matchMedia("(prefers-reduced-motion:reduce)").matches) { cv.remove(); return; }
  const cx = cv.getContext("2d"); let W = 0, H = 0, lw = 0, run = true, dots = [];
  const size = () => {
    const r = cv.parentElement.getBoundingClientRect(), d = Math.min(devicePixelRatio || 1, 1.5);
    W = r.width; H = r.height; cv.width = W * d; cv.height = H * d; cx.setTransform(d, 0, 0, d, 0, 0);
    dots = Array.from({length: W < 700 ? 14 : 26}, () => ({x: Math.random() * W, y: Math.random() * H, r: 14 + Math.random() * 46, vx: (Math.random() - .5) * .22, vy: -.08 - Math.random() * .2, a: .06 + Math.random() * .14}));
  };
  const tick = () => {
    if (run){
      cx.clearRect(0, 0, W, H);
      dots.forEach(p => {
        p.x += p.vx; p.y += p.vy;
        if (p.y < -p.r){ p.y = H + p.r; p.x = Math.random() * W; }
        if (p.x < -p.r) p.x = W + p.r; if (p.x > W + p.r) p.x = -p.r;
        const g = cx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
        g.addColorStop(0, "rgba(249,223,138," + p.a + ")"); g.addColorStop(.7, "rgba(229,184,75," + p.a * .5 + ")"); g.addColorStop(1, "rgba(229,184,75,0)");
        cx.fillStyle = g; cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 6.2832); cx.fill();
      });
    }
    requestAnimationFrame(tick);
  };
  size(); lw = innerWidth;
  addEventListener("resize", () => { if (innerWidth !== lw){ lw = innerWidth; size(); } });
  new IntersectionObserver(es => { run = es[0].isIntersecting; }).observe(cv.parentElement);
  tick();
})();
